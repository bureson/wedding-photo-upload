# Generated by `firebase init hosting:github`, lightly edited.
# The site is a static page in public/ — nothing to build.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEDDING_PHOTO_UPLOAD_6A020 }}
          channelId: live
          projectId: wedding-photo-upload-6a020
