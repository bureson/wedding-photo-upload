<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- cream background -->
  <rect width="64" height="64" rx="14" fill="#f3efe8"/>
  <!-- polaroid, tilted -->
  <g transform="rotate(-8 32 34)">
    <rect x="14" y="12" width="36" height="44" fill="#2e2620" opacity="0.14" transform="translate(1.2 2.2)"/>
    <rect x="14" y="12" width="36" height="44" fill="#ffffff"/>
    <!-- photo -->
    <rect x="17.5" y="15.5" width="29" height="29" fill="#b06a4c"/>
    <rect x="17.5" y="15.5" width="29" height="29" fill="url(#g)"/>
    <!-- heart -->
    <path d="M32 39.5 c-7.5 -5.3 -9.5 -8.2 -9.5 -11.6 c0 -2.9 2.2 -5 5 -5 c1.9 0 3.5 1.1 4.5 2.7 c1 -1.6 2.6 -2.7 4.5 -2.7 c2.8 0 5 2.1 5 5 c0 3.4 -2 6.3 -9.5 11.6z" fill="#ffffff"/>
    <!-- tape -->
    <rect x="23" y="8.5" width="18" height="6" fill="#e9d98f" opacity="0.9" transform="rotate(6 32 11.5)"/>
  </g>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
</svg>
